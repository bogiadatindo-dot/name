name: Build iOS Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          rm -rf $HOME/theos
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          git clone https://github.com/theos/sdks.git $HOME/theos/sdks

      - name: Build Dylib
        env:
          THEOS: ${{ runner.env.HOME }}/theos
        run: |
          make clean all FINALPACKAGE=1

      - name: Prepare Dylib Artifact
        run: |
          mkdir -p compiled_dylib
          cp .theos/obj/BogiadatXTedTeam.dylib compiled_dylib/BogiadatXTedTeam.dylib

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BogiadatXTedTeam-dylib
          path: compiled_dylib/BogiadatXTedTeam.dylib
