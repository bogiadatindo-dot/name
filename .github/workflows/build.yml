
name: Build RainbowBar

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.6.3
        with:
          theos-src: waruhachi/theos
          theos-branch: main
          sdks-src: waruhachi/sdks
          sdks-branch: main

      - name: Build
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=rootless

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: RainbowBar
          path: |
            packages/*.deb
            .theos/**/*.dylib
